# nginx site config template for OpenMiQ-API (docs/DESIGN.md §14.3), for use
# with certbot's nginx plugin.
#
# This is the *example* copy (deploy-example/), tracked in git. Your real,
# customized config goes in deploy/ instead (gitignored, same pattern as
# .env.example -> .env) — see docs/DEPLOYMENT.md step 4 for the full
# sequence, in short:
#   cp -r deploy-example deploy
#   $EDITOR deploy/nginx/openmiq-api.conf   # replace miq.example.com below
#   sudo cp deploy/nginx/openmiq-api.conf /etc/nginx/sites-available/openmiq-api
#   sudo ln -s /etc/nginx/sites-available/openmiq-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d miq.example.com`: its nginx plugin clones
# this server block into a new "listen 443 ssl" one (adding the
# ssl_certificate lines) and turns this one into the plain :80->:443
# redirect, in place, automatically — there's no need to hand-write or
# uncomment a 443 block yourself.

# Anubis (docs/DEPLOYMENT.md step 5, optional) sits in front of apps/web only — a bot request never gets a fair shot at solving Anubis's JS challenge, so apps/api (this instance's API keys, the npm package, /playground's own server-side proxy) must stay reachable directly instead of through this upstream.
# Comment this block and the `proxy_pass http://anubis;` line below out (falling back to `proxy_pass http://127.0.0.1:9414;` directly) if you don't want Anubis at all.
upstream anubis {
    # Must match Anubis's own BIND/BIND_NETWORK — see deploy-example/anubis/openmiq-web.env.
    server unix:/run/anubis/openmiq-web.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name miq.example.com;

    # apps/api (Hono, API_PORT default 9413) — proxied as-is, no prefix rewrite: every endpoint in docs/DESIGN.md §8 already starts with /api/.
    # Deliberately bypasses the `anubis` upstream below — see its comment.
    location /api/ {
        proxy_pass http://127.0.0.1:9413;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/web (SvelteKit/adapter-node, PORT default 9414) — everything else,
    # through Anubis rather than directly.
    location / {
        proxy_pass http://anubis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
