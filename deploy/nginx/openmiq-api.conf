# nginx site config for OpenMiQ-API (docs/DESIGN.md §14.3), for use with
# certbot's nginx plugin.
#
# Install (before requesting a certificate — see docs/DEPLOYMENT.md step 4):
#   sudo cp deploy/nginx/openmiq-api.conf /etc/nginx/sites-available/openmiq-api
#   sudo ln -s /etc/nginx/sites-available/openmiq-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d miq.example.com`: its nginx plugin clones
# this server block into a new "listen 443 ssl" one (adding the
# ssl_certificate lines) and turns this one into the plain :80->:443
# redirect, in place, automatically — there's no need to hand-write or
# uncomment a 443 block yourself.
#
# Replace miq.example.com below with your own domain if you're self-hosting
# under a different one.

server {
    listen 80;
    listen [::]:80;
    server_name miq.example.com;

    # apps/api (Hono, API_PORT default 9413) — proxied as-is, no prefix
    # rewrite: every endpoint in docs/DESIGN.md §8 already starts with /api/.
    location /api/ {
        proxy_pass http://127.0.0.1:9413;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/web (SvelteKit/adapter-node, PORT default 9414) — everything else.
    location / {
        proxy_pass http://127.0.0.1:9414;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
